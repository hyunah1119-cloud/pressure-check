<style>
/* Layout: control panel left, A4 sheet preview right; stacks on narrow screens. Paper is always white. */
:root{
  --ink:#1b2333; --muted:#5d6779; --line:#d5dae4; --bg:#eef1f6; --panel:#ffffff;
  --navy:#2a5599; --soft:#e7ecf7; --warn:#a4501b; --warn-bg:#fdf1e7;
  --neg:#2a5599; --pos:#b23a48; --both:#6a3fa0;
  --font:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#e6eaf2; --muted:#9aa4b6; --line:#34405a; --bg:#151a24; --panel:#1d2433;
  --soft:#25304a; --warn:#f0a774; --warn-bg:#3a2a1d; color-scheme:dark } }
:root[data-theme="dark"]{ --ink:#e6eaf2; --muted:#9aa4b6; --line:#34405a; --bg:#151a24; --panel:#1d2433;
  --soft:#25304a; --warn:#f0a774; --warn-bg:#3a2a1d; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:100vh}
.panel{background:var(--panel);border-right:1px solid var(--line);padding:20px max(16px,env(safe-area-inset-left,0px)) 40px 20px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.brand h1{font-size:19px;margin:0;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.step{border-top:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:9px}
.step h2{font-size:13px;margin:0;display:flex;gap:8px;align-items:center}
.step h2 b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:11.5px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
select,input[type=text]{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
select.empty{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rooms{display:flex;flex-direction:column;gap:4px}
.room{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.room.off{opacity:.5}
.room input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--navy)}
.room .nm{font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.room select{width:auto;padding:3px 4px;font-size:12.5px}
.tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:10px;color:#fff;white-space:nowrap}
.tag.음압{background:var(--neg)} .tag.양압{background:var(--pos)} .tag.양음압{background:var(--both)}
.mini{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:12.5px}
.btn:hover:not(:disabled){border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700;font-size:15px;padding:11px 14px;width:100%}
.btn.wide{width:100%;font-size:14px;padding:9px 12px}
.seg{display:flex;flex-direction:column;gap:6px}
.seg label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.seg label:has(input:checked){border-color:var(--navy);background:var(--soft)}
.seg small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.seg input{accent-color:var(--navy);margin-top:3px}
.seg-row{flex-direction:row}
.seg-row label{flex:1;align-items:center;justify-content:center;font-weight:700}
.pagehead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--navy);margin-top:6px;padding:0 2px}
.pagehead span{font-weight:400;color:var(--muted)}
.pagehead.full span{color:var(--warn)}
.pagehead.off{color:var(--muted)}
.pagehead.over{color:var(--warn)} .pagehead.over span{color:var(--warn);font-weight:700}
.room.over{border-color:var(--warn);background:var(--warn-bg)}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.warn{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:7px 9px}
details summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
details .inner{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.addrow{display:grid;grid-template-columns:1fr auto auto;gap:6px}
.addrow select{width:auto}
.stage{padding:24px max(16px,env(safe-area-inset-right,0px)) 60px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.stagebar{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
#pages{display:flex;flex-direction:column;gap:18px;align-items:center}
.emptystate{max-width:420px;text-align:center;color:var(--muted);padding:80px 20px;line-height:1.7}
.emptystate b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.copied{color:var(--navy);font-weight:700}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .panel{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .stage{padding-left:max(16px,env(safe-area-inset-left,0px))}
}

/* ---------------- A4 sheet (always paper white) ---------------- */
.sheet{width:210mm;height:296.5mm;padding:10mm 12mm 7mm;background:#fff;color:#111;display:flex;flex-direction:column;
  font-family:var(--font);font-size:8pt;box-shadow:0 2px 14px rgba(20,30,60,.18);overflow:hidden;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .t{text-align:center;font-size:18pt;font-weight:800;letter-spacing:-.03em;margin:1mm 0 0}
.sheet .ym{text-align:right;font-size:11pt;font-weight:700;margin:1mm 0 1.5mm}
.sheet .ym u{text-decoration:none;border-bottom:.35mm solid #111;display:inline-block;min-width:10mm;text-align:center}
.sheet .lb{font-weight:800;font-size:9pt;margin:1.8mm 0 .7mm}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet td{border:.25mm solid #9aa1b0;padding:0 .8mm;text-align:center;vertical-align:middle;line-height:1.25;overflow:hidden;color:#333;font-size:8pt}
.sheet td p{margin:0}
.sheet td.c-th{background:#2a5599;color:#fff;font-weight:700;border-color:#7d93bd}
.sheet td.c-soft{background:#e7ecf7;font-weight:700;color:#111;font-size:8.4pt}
.sheet td.c-softL{background:#e7ecf7;color:#111;text-align:left;vertical-align:top;padding:.8mm 1.6mm}
.sheet td.c-softL p{padding-left:2.6mm;text-indent:-2.6mm;margin-bottom:.3mm}
.sheet td.c-room{background:#fff;color:#111;font-size:9pt;font-weight:800;border-color:#2a5599}
.sheet td.c-date{color:#2a5599;font-weight:700;font-size:8.2pt}
.sheet td.c-j{font-size:7.8pt;white-space:nowrap;letter-spacing:-.02em}
.sheet td.c-footL,.sheet td.c-footR{border:0;color:#444;vertical-align:bottom;padding:0}
.sheet td.c-footL{text-align:left} .sheet td.c-footR{text-align:right}
.sheet td.c-footR img{height:5mm;width:auto;display:inline-block;vertical-align:bottom}
.sheet span.wd{font-size:6.8pt;font-weight:400;color:#555} .sheet span.sun{font-size:6.8pt;font-weight:400;color:#c0392b} .sheet span.sat{font-size:6.8pt;font-weight:400;color:#2a5599}
.sheet .foot{margin-top:auto;padding-top:2mm}

@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff}
  .panel,.stagebar{display:none!important}
  .app{display:block}
  .stage{padding:0;display:block}
  #pages{display:block;zoom:1!important;gap:0}
  .sheet{box-shadow:none;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="brand">
      <h1>양·음압시설 점검일지 만들기</h1>
      <p>부서와 시설을 고르면 점검일지가 자동으로 만들어집니다.</p>
    </div>

    <section class="step">
      <h2><b>1</b>부서 선택</h2>
      <select id="dept" aria-label="부서"></select>
      <label class="f" id="deptNameWrap" hidden>양식에 표시할 부서명
        <input type="text" id="deptName" placeholder="부서명을 입력하세요">
      </label>
    </section>

    <section class="step">
      <h2><b>2</b>점검일지에 넣을 시설</h2>
      <div class="mini" id="allBtns">
        <button class="btn" id="allOn" type="button">모두 선택</button>
        <button class="btn" id="allOff" type="button">모두 해제</button>
      </div>
      <div class="rooms" id="rooms"></div>
      <details id="addBox">
        <summary>목록에 없는 시설 추가</summary>
        <div class="inner">
          <div class="addrow">
            <input type="text" id="newName" placeholder="시설명">
            <select id="newType" aria-label="시설 종류"><option>음압</option><option>양압</option><option value="양음압">양·음압</option></select>
            <button class="btn" id="addBtn" type="button">추가</button>
          </div>
        </div>
      </details>
    </section>

    <section class="step" id="visualStep" hidden>
      <h2>양압 병실 점검 방법</h2>
      <div class="seg" id="visual">
        <label><input type="radio" name="visual" value="1" checked><span>육안점검<small>차압계가 없을 때: 천장에 붙인 습자지로 공기 흐름 확인</small></span></label>
        <label><input type="radio" name="visual" value="0"><span>차압계 확인<small>차압계 설치 후: 측정값(Pa) 기록</small></span></label>
      </div>
    </section>

    <section class="step" id="unitStep">
      <h2><b>3</b>기록단위</h2>
      <div class="seg seg-row" id="unit"></div>
      <p class="note" id="unitNote"></p>
    </section>

    <section class="step">
      <h2><b>4</b>페이지 나누는 방법</h2>
      <div class="seg" id="mode">
        <label><input type="radio" name="mode" value="each" checked><span>시설마다 한 페이지씩<small>예: 한 병실당 한 페이지씩</small></span></label>
        <label><input type="radio" name="mode" value="pack"><span>여러 시설을 한 페이지에<small>예: 음압·양압 병실은 4개까지, 양·음압 병실은 2개까지 가능</small></span></label>
        <label><input type="radio" name="mode" value="custom"><span>직접 묶기<small>시설마다 몇 페이지에 넣을지 고릅니다. 위 시설 목록이 페이지별로 묶여서 보입니다</small></span></label>
      </div>
      <div id="warn" class="warn" hidden></div>
    </section>

    <section class="step">
      <h2><b>5</b>연·월 (선택)</h2>
      <div class="row2">
        <select id="year" aria-label="연도"></select>
        <select id="month" aria-label="월"></select>
      </div>
      <p class="note">비워두면 "20&nbsp;&nbsp;&nbsp;년&nbsp;&nbsp;&nbsp;월"과 1~31일 칸으로 나옵니다. 고르면 그 달 날짜 수와 요일이 들어갑니다.</p>
    </section>

    <section class="step">
      <div id="warn2" class="warn" hidden></div>
      <button class="btn primary" id="hwpBtn" type="button">한글 파일로 받기 (.hwpx)</button>
      <button class="btn wide" id="printBtn" type="button">인쇄 / PDF로 저장</button>
      <p class="note">한글 파일은 한글 2014 이상에서 열립니다. 열어서 .hwp로 다시 저장해 두고 써도 됩니다. 인쇄 창이 뜨지 않으면 이 페이지를 크롬이나 엣지에서 열어 주세요.</p>
      <button class="btn" id="linkBtn" type="button">이 부서 설정으로 바로 열리는 링크 복사</button>
      <span id="linkMsg" class="note" aria-live="polite"></span>
    </section>
  </aside>

  <main class="stage">
    <div class="stagebar"><span id="summary"></span><span>미리보기</span></div>
    <div id="pages"></div>
  </main>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const COLS = t => t === '양음압' ? 2 : 1;
  const CUSTOM = '__custom__';
  const PAGE_W = 186; // 본문 폭(mm)

  let state = { dept: '', deptName: '', rooms: [], mode: 'each', year: '', month: '', visual: true, unit: CONFIG.defaultUnit };

  const deptInfo = d => FACILITIES.find(x => x.dept === d) || null;
  function deptRooms(dept){
    const f = deptInfo(dept);
    return f ? f.rooms.map(r => ({ name: r[0], type: r[1], profile: r[2] || '' })) : [];
  }
  function resetRooms(){
    state.rooms = deptRooms(state.dept).map(r => ({ ...r, on: true, sheet: 1 }));
    autoCustom();
  }
  function autoCustom(){ let n = 0; state.rooms.forEach(r => { if (r.on) r.sheet = ++n; }); }
  // 직접 묶기: 지금 보이는 페이지 구성 그대로 시작
  function customFromCurrent(prevMode){
    const keep = state.mode; state.mode = prevMode;
    const { sheets } = sheetsFor(); state.mode = keep;
    sheets.forEach((s, i) => s.forEach(r => r.sheet = i + 1));
    normalizePages();
  }
  // 빈 페이지 번호를 없애고 1부터 다시 매김
  function normalizePages(){
    const used = [...new Set(state.rooms.filter(r => r.on).map(r => r.sheet))].sort((a, b) => a - b);
    const map = {}; used.forEach((p, i) => map[p] = i + 1);
    state.rooms.forEach(r => { if (r.on) r.sheet = map[r.sheet]; });
  }
  function pageInfo(){
    const pages = {};
    state.rooms.forEach(r => { if (!r.on) return; const p = pages[r.sheet] = pages[r.sheet] || { cols: 0, profile: r.profile, rooms: [] }; p.cols += COLS(r.type); p.rooms.push(r); });
    return pages;
  }
  // 이 시설이 들어갈 수 있는 페이지인가
  function fits(room, page, pages){
    const p = pages[page];
    if (!p) return true;
    if (room.on && room.sheet === page) return true;
    return p.profile === room.profile;
  }
  // 칸이 남는 페이지인가 (자동 배치용)
  function hasRoom(room, page, pages){
    const p = pages[page];
    return fits(room, page, pages) && (!p || (room.on && room.sheet === page) || p.cols + COLS(room.type) <= CONFIG.maxColumnsPerSheet);
  }
  function overPages(){
    if (state.mode !== 'custom') return [];
    const pages = pageInfo();
    return Object.keys(pages).map(Number).filter(n => pages[n].cols > CONFIG.maxColumnsPerSheet).sort((a, b) => a - b);
  }
  function placeRoom(room){
    const pages = pageInfo(); const nums = Object.keys(pages).map(Number);
    const free = nums.sort((a, b) => a - b).find(n => hasRoom(room, n, pages));
    room.sheet = free || (nums.length ? Math.max(...nums) + 1 : 1);
  }

  // ---------- 페이지 나누기 ----------
  function sheetsFor(){
    const on = state.rooms.filter(r => r.on);
    const byProfile = {};
    on.forEach(r => (byProfile[r.profile] = byProfile[r.profile] || []).push(r));
    const max = CONFIG.maxColumnsPerSheet;
    const sheets = []; let overflow = false;
    const pack = (rs, flag) => {
      let cur = [], c = 0;
      rs.forEach(r => { if (cur.length && c + COLS(r.type) > max) { sheets.push(cur); cur = []; c = 0; if (flag) overflow = true; } cur.push(r); c += COLS(r.type); });
      if (cur.length) sheets.push(cur);
    };
    if (state.mode === 'custom') {
      const groups = {};
      on.forEach(r => (groups[r.sheet] = groups[r.sheet] || []).push(r));
      Object.keys(groups).map(Number).sort((a,b) => a - b).forEach(k => pack(groups[k], true));
      return { sheets, overflow };
    }
    Object.keys(byProfile).sort((a,b) => (a ? 1 : 0) - (b ? 1 : 0)).forEach(p => {
      const rs = byProfile[p];
      if (state.mode === 'each') rs.forEach(r => sheets.push([r]));
      else if (state.mode === 'pack') pack(rs, false);
      else {
        const groups = {};
        rs.forEach(r => (groups[r.sheet] = groups[r.sheet] || []).push(r));
        Object.keys(groups).map(Number).sort((a,b) => a - b).forEach(k => pack(groups[k], true));
      }
    });
    return { sheets, overflow };
  }

  // ---------- 한 페이지의 내용 (HTML·한글 공통) ----------
  const WD = ['일','월','화','수','목','금','토'];
  const P = (text, s) => [[{ t: text, s }]];           // 문단 1개
  const PL = (lines, s) => lines.map(t => [{ t, s }]);  // 줄마다 문단

  // 라벨|값|라벨|값 표: 값 줄 수가 다르면 라벨을 세로로 합침
  function infoGrid(pairs){
    const cols = [0.22, 0.28, 0.22, 0.28].map(x => x * PAGE_W);
    const rows = [], cells = []; let r = 0;
    pairs.forEach(([la, va, lb, vb]) => {
      // 오른쪽 항목이 없으면 왼쪽 값이 끝까지 이어짐
      const n = Math.max(va.length, vb ? vb.length : 0);
      for (let i = 0; i < n; i++) rows.push(4.6);
      cells.push({ r, c: 0, rs: n, cs: 1, st: 'th', p: P(la) });
      if (lb) cells.push({ r, c: 2, rs: n, cs: 1, st: 'th', p: P(lb) });
      const vals = lb ? [[va, 1, 1], [vb, 3, 1]] : [[va, 1, 3]];
      vals.forEach(([v, c, cs]) => v.forEach((t, i) => cells.push({ r: r + i, c, rs: i === v.length - 1 ? n - i : 1, cs, st: 'td', p: P(t) })));
      r += n;
    });
    return { cols, rows, cells };
  }

  function sheetModel(rooms, idx, total){
    const prof = rooms[0].profile ? (CONFIG.profiles[rooms[0].profile] || {}) : {};
    const groups = [];
    rooms.forEach(r => {
      if (r.type === '양음압') groups.push({ k: '음압' }, { k: '양압' });
      else groups.push({ k: r.type, visual: r.type === '양압' && !!r.visual });
    });
    const hasBoth = rooms.some(r => r.type === '양음압');
    const hasNeg = groups.some(g => g.k === '음압');
    const hasPosM = groups.some(g => g.k === '양압' && !g.visual);
    const hasPosV = groups.some(g => g.k === '양압' && g.visual);
    const hasPos = hasPosM || hasPosV;
    const meter = hasNeg || hasPosM;
    const title = prof.title || (hasNeg && hasPos ? '양·음압시설 점검일지' : hasNeg ? '음압시설 점검일지' : '양압시설 점검일지');
    const dept = state.dept === CUSTOM ? state.deptName : (prof.deptLabel || state.dept);

    const method = !hasPosV ? CONFIG.method : !meter ? [CONFIG.visual.method] : ['음압: ' + CONFIG.method[0], '양압: ' + CONFIG.visual.method];
    const unit = meter ? [state.unit] : [CONFIG.visual.unit];
    const U = CONFIG.units[state.unit] || CONFIG.units[CONFIG.defaultUnit];
    const blocks = [];
    blocks.push({ type: 'title', text: `[${dept || '　　　　'}] ${title}` });
    blocks.push({ type: 'ym', year: state.year, month: state.month });
    blocks.push({ type: 'grid', grid: infoGrid([
      ['점검주기', prof.cycle || CONFIG.cycle, '점검직원', prof.staff || CONFIG.staff],
      meter ? ['측정방법', method, '기록단위', unit] : ['측정방법', method],
    ]) });

    // 정상 기준
    const crit = [];
    if (hasNeg) crit.push(U.neg);
    if (hasPosM) crit.push(U.pos);
    if (hasPosV) crit.push(CONFIG.visual.criteria);
    blocks.push({ type: 'label', text: '압력 측정 정상 기준' });
    blocks.push({ type: 'grid', grid: { cols: crit.map(() => PAGE_W / crit.length), rows: [5.4],
      cells: crit.map((t, i) => ({ r: 0, c: i, rs: 1, cs: 1, st: 'soft', p: P(t) })) } });

    // 점검 및 기록 방법
    const mNeg = hasNeg, mPos = hasPosM;
    const left = [];
    if (meter) left.push(CONFIG.howToMeter.replace('{대상}', mNeg && mPos ? '음·양압' : mNeg ? '음압' : '양압').replace('{부호}', mNeg && mPos ? '+/-' : mNeg ? '-' : '+'));
    if (hasPosV) left.push(CONFIG.visual.howTo);
    CONFIG.howToCommon.forEach(t => left.push(t.replace('{전화}', CONFIG.facilityTeamPhone)));
    // 적용 기준은 육안점검만 있는 페이지와 noRule 부서(매일 측정 부서)에는 넣지 않음
    const showRule = CONFIG.bothRule.length && meter && !(deptInfo(state.dept) || {}).noRule;
    const howCols = showRule ? [PAGE_W / 2, PAGE_W / 2] : [PAGE_W];
    const howCells = [{ r: 0, c: 0, rs: 1, cs: 1, st: 'softL', p: PL(left.map(t => '• ' + t)) }];
    if (showRule) howCells.push({ r: 0, c: 1, rs: 1, cs: 1, st: 'softL', p: PL(CONFIG.bothRule.map(t => '• ' + t)) });
    blocks.push({ type: 'label', text: '점검 및 기록 방법' });
    blocks.push({ type: 'grid', grid: { cols: howCols, rows: [5.4], cells: howCells } });

    // 일일점검 기록
    const withWd = !!(state.year && state.month);
    const dW = withWd ? 10.5 : 8, sW = 16, sub = groups.length * 2, cW = (PAGE_W - dW - sW) / sub;
    const cols = [dW, ...Array(sub).fill(cW), sW];
    const nDays = withWd ? new Date(+state.year, +state.month, 0).getDate() : 31;
    const tallInfo = Math.max((prof.cycle || CONFIG.cycle).length, (prof.staff || CONFIG.staff).length) > 1;
    const rows = [4.7, 4.7, 4.7, ...Array(nDays).fill(tallInfo ? 5.0 : 5.2)];
    const cells = [{ r: 0, c: 0, rs: 3, cs: 1, st: 'th', p: P('일자') }, { r: 0, c: sub + 1, rs: 3, cs: 1, st: 'th', p: [[{ t: '점검자' }], [{ t: '서명' }]] }];
    let c = 1, gi = 0;
    rooms.forEach(r => { const span = COLS(r.type) * 2; cells.push({ r: 0, c, rs: 1, cs: span, st: 'room', p: P(r.name) }); c += span; });
    groups.forEach((g, i) => {
      const cc = 1 + i * 2;
      cells.push({ r: 1, c: cc, rs: 1, cs: 2, st: 'th', p: P(g.visual ? '양압 (육안)' : g.k) });
      if (g.visual) cells.push({ r: 2, c: cc, rs: 1, cs: 2, st: 'th', p: P('판정') });
      else cells.push({ r: 2, c: cc, rs: 1, cs: 1, st: 'th', p: P('측정값') }, { r: 2, c: cc + 1, rs: 1, cs: 1, st: 'th', p: P('판정') });
    });
    for (let d = 1; d <= nDays; d++) {
      const r = d + 2;
      const runs = [{ t: String(d) }];
      if (withWd) { const w = new Date(+state.year, +state.month - 1, d).getDay(); runs.push({ t: ' ' + WD[w], s: w === 0 ? 'sun' : w === 6 ? 'sat' : 'wd' }); }
      cells.push({ r, c: 0, rs: 1, cs: 1, st: 'date', p: [runs] });
      groups.forEach((g, i) => {
        const cc = 1 + i * 2;
        if (g.visual) cells.push({ r, c: cc, rs: 1, cs: 2, st: 'j', p: P('□정상 □이상') });
        else cells.push({ r, c: cc, rs: 1, cs: 1, st: 'td', p: P('') }, { r, c: cc + 1, rs: 1, cs: 1, st: 'j', p: P('□정상 □이상') });
      });
      cells.push({ r, c: sub + 1, rs: 1, cs: 1, st: 'td', p: P('') });
    }
    blocks.push({ type: 'label', text: '일일점검 기록' });
    blocks.push({ type: 'grid', grid: { cols, rows, cells, headerRows: 3 } });

    // 이상 발생 시
    const abW = [0.06, 0.25, 0.285, 0.258, 0.147].map(x => x * PAGE_W);
    const abH = ['발생일', '시설명', '측정값 및 문제점', '조치내용 및 결과', '부서 확인자 서명'];
    const abCells = abH.map((t, i) => ({ r: 0, c: i, rs: 1, cs: 1, st: 'th', p: P(t) }));
    for (let r = 1; r <= 2; r++) abH.forEach((_, i) => abCells.push({ r, c: i, rs: 1, cs: 1, st: 'td', p: P('') }));
    blocks.push({ type: 'label', text: '이상 발생 시 점검 및 조치사항 (이상 발생 건에 한하여 기록)' });
    blocks.push({ type: 'grid', grid: { cols: abW, rows: [4.7, 5.4, 5.4], cells: abCells } });

    blocks.push({ type: 'foot', text: CONFIG.version + (total > 1 ? ` · ${idx + 1}/${total}` : '') });
    return blocks;
  }

  // ---------- HTML 미리보기 ----------
  function gridHTML(g){
    const byRow = g.rows.map(() => []);
    g.cells.forEach(c => byRow[c.r].push(c));
    const col = '<colgroup>' + g.cols.map(w => `<col style="width:${w.toFixed(2)}mm">`).join('') + '</colgroup>';
    return `<table>${col}${byRow.map((cs, r) => `<tr style="height:${g.rows[r]}mm">${cs.sort((a,b) => a.c - b.c).map(c =>
      `<td class="c-${c.st}"${c.rs > 1 ? ` rowspan="${c.rs}"` : ''}${c.cs > 1 ? ` colspan="${c.cs}"` : ''}>${c.p.map(para => `<p>${para.map(run => run.s ? `<span class="${run.s}">${esc(run.t)}</span>` : esc(run.t)).join('') || '&nbsp;'}</p>`).join('')}</td>`).join('')}</tr>`).join('')}</table>`;
  }
  function sheetHTML(blocks){
    return '<div class="sheet">' + blocks.map(b => {
      if (b.type === 'title') return `<div class="t">${esc(b.text)}</div>`;
      if (b.type === 'ym') return `<div class="ym">${b.year ? `<u>${b.year}</u>` : '20<u>&nbsp;</u>'}년 <u>${b.month || '&nbsp;'}</u>월</div>`;
      if (b.type === 'label') return `<div class="lb">${esc(b.text)}</div>`;
      if (b.type === 'grid') return gridHTML(b.grid);
      if (b.type === 'foot') return `<table class="foot"><tr><td class="c-footL">${esc(b.text)}</td><td class="c-footR"><img src="${LOGO}" alt=""></td></tr></table>`;
    }).join('') + '</div>';
  }

  // 압축 없는 ZIP
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

      const lh = new DataView(new ArrayBuffer(30));

    if (!state.rooms.length) { $('#rooms').innerHTML = '<p class="note">아래 "목록에 없는 시설 추가"로 시설을 넣어주세요.</p>'; return; }
    if (state.mode !== 'custom') { $('#rooms').innerHTML = state.rooms.map((r, i) => roomRow(r, i)).join(''); return; }

    // 직접 묶기: 페이지별로 묶어서 보여주고, 자리가 남는 페이지만 고를 수 있게 함
    const pages = pageInfo();
    const nums = Object.keys(pages).map(Number).sort((a, b) => a - b);
    const max = CONFIG.maxColumnsPerSheet;
    const select = (r, i) => {
      const opts = nums.map(n => {
        const ok = fits(r, n, pages);
        const p = pages[n], mine = r.sheet === n;
        const why = !ok ? ' (다른 양식)' : (!mine && p.cols + COLS(r.type) > max) ? ' (가득 참)' : '';
        return `<option value="${n}" ${r.sheet === n ? 'selected' : ''} ${ok ? '' : 'disabled'}>${n}페이지${why}</option>`;
      });
      const alone = pages[r.sheet] && pages[r.sheet].rooms.length === 1;
      if (!alone) opts.push(`<option value="new">새 페이지로</option>`);
      return `<select data-s="${i}" aria-label="${esc(r.name)} 페이지">${opts.join('')}</select>`;
    };
    let html = nums.map(n => {
      const p = pages[n];
      const over = p.cols > max;
      const tag = over ? ' · 넘침, 이동 필요' : p.cols === max ? ' · 가득 참' : '';
      return `<div class="pagehead${over ? ' over' : p.cols === max ? ' full' : ''}">${n}페이지<span>${p.cols}/${max}칸${tag}</span></div>` +
        p.rooms.map(r => roomRow(r, state.rooms.indexOf(r), select(r, state.rooms.indexOf(r)), over)).join('');
    }).join('');
    const offs = state.rooms.filter(r => !r.on);
    if (offs.length) html += `<div class="pagehead off">선택 안 한 시설</div>` + offs.map(r => roomRow(r, state.rooms.indexOf(r))).join('');
    $('#rooms').innerHTML = html;
  }

  function render(){
    renderRooms();
    $('#visualStep').hidden = !(deptInfo(state.dept) || {}).visualOption;
    $('#dept').classList.toggle('empty', !state.dept);
    const pages = $('#pages');
    const { blocks, sheets, overflow } = currentSheets();
    const over = overPages();
    const ok = !!state.dept && sheets.length > 0 && !over.length;
    $('#unitStep').hidden = !!state.dept && !state.rooms.some(r => r.on && !(r.type === '양압' && r.visual));
    ['#hwpBtn', '#printBtn', '#linkBtn'].forEach(s => $(s).disabled = !ok);
    if (!state.dept) {
      pages.innerHTML = '<div class="emptystate"><b>부서를 선택하세요</b>왼쪽에서 부서를 고르면 점검일지 미리보기가 여기에 나옵니다.</div>';
      $('#summary').textContent = '';
    } else if (!sheets.length) {
      pages.innerHTML = '<div class="emptystate"><b>시설을 하나 이상 선택하세요</b></div>';
      $('#summary').textContent = '';
    } else {
      pages.innerHTML = blocks.map(sheetHTML).join('');
      $('#summary').textContent = `총 ${sheets.length}페이지 · 시설 ${sheets.reduce((a, s) => a + s.length, 0)}개`;
    }
    const msgs = [];
    if (over.length) msgs.push(`${over.join(', ')}페이지에 칸이 넘칩니다(한 페이지 최대 ${CONFIG.maxColumnsPerSheet}칸). 시설을 다른 페이지로 옮겨야 한글 파일 받기와 인쇄를 할 수 있어요.`);
    else if (overflow) msgs.push('한 페이지에 다 들어가지 않는 묶음이 있어서 다음 페이지로 넘겼습니다.');
    if (state.mode === 'pack' && new Set(state.rooms.filter(r => r.on).map(r => r.profile)).size > 1) msgs.push('선별진료소는 별도 양식이라 다른 시설과 섞지 않고 따로 만듭니다.');
    $('#warn').hidden = !msgs.length; $('#warn').textContent = msgs.join(' ');
    $('#warn2').hidden = !over.length; $('#warn2').textContent = over.length ? `${over.join(', ')}페이지의 칸이 넘쳐서 아직 받을 수 없어요. 2번 시설 목록에서 옮겨 주세요.` : '';
    fit();
  }

  function fit(){
    const stage = document.querySelector('.stage');
    const avail = stage.clientWidth - 48, pw = 210 * 96 / 25.4;
    $('#pages').style.zoom = Math.min(1, Math.max(.3, avail / pw)).toFixed(3);
  }

  // ---------- 링크 ----------
  function loadHash(){
    const h = new URLSearchParams(location.hash.slice(1));
    const d = h.get('dept');
    if (!d || !(deptInfo(d) || d === CUSTOM)) return false;
    state.dept = d; state.deptName = h.get('name') || ''; state.mode = h.get('mode') || 'each';
    state.visual = h.get('visual') !== '0';
    state.unit = CONFIG.units[h.get('unit')] ? h.get('unit') : CONFIG.defaultUnit;
    resetRooms();
    const offs = (h.get('off') || '').split('|').filter(Boolean);
    const sh = (h.get('sheet') || '').split('|');
    state.rooms.forEach((r, i) => { r.on = !offs.includes(r.name); if (sh[i]) r.sheet = +sh[i]; });
    if (state.mode === 'custom') normalizePages();
    return true;
  }
  function shareLink(){
    const p = new URLSearchParams();
    p.set('dept', state.dept);
    if (state.dept === CUSTOM && state.deptName) p.set('name', state.deptName);
    p.set('mode', state.mode);
    const base = deptRooms(state.dept).map(r => r.name);
    const offs = state.rooms.filter(r => !r.on && base.includes(r.name)).map(r => r.name);
    if (offs.length) p.set('off', offs.join('|'));
    if (state.unit !== CONFIG.defaultUnit) p.set('unit', state.unit);
    if (state.mode === 'custom') p.set('sheet', state.rooms.map(r => r.sheet).join('|'));
    if ((deptInfo(state.dept) || {}).visualOption && !state.visual) p.set('visual', '0');
    return location.href.split('#')[0] + '#' + p.toString();
  }

  function syncInputs(){
    $('#dept').value = state.dept;
    $('#deptNameWrap').hidden = state.dept !== CUSTOM;
    if (state.dept === CUSTOM) $('#addBox').open = true;
    $('#deptName').value = state.deptName;
    document.querySelectorAll('input[name=mode]').forEach(x => x.checked = x.value === state.mode);
    document.querySelectorAll('input[name=visual]').forEach(x => x.checked = (x.value === '1') === state.visual);
    $('#year').value = state.year; $('#month').value = state.month;
    document.querySelectorAll('input[name=unit]').forEach(x => x.checked = x.value === state.unit);
    const U = CONFIG.units[state.unit];
    $('#unitNote').textContent = U ? `정상 기준: ${U.neg.replace(/^.*I\s*/, '음압 ')} / ${U.pos.replace(/^.*I\s*/, '양압 ')}` : '';
  }

  function fileName(){
    const d = state.dept === CUSTOM ? (state.deptName || '부서') : state.dept;
    const ym = state.year && state.month ? ` ${state.year}년 ${state.month}월` : '';
    return `${d} 양음압시설 점검일지${ym}.hwpx`.replace(/[\\/:*?"<>|]/g, '_');
  }

  // ---------- 이벤트 ----------
  buildSelects(); loadHash(); syncInputs(); render();

  $('#dept').addEventListener('change', e => { state.dept = e.target.value; state.deptName = ''; state.visual = true; resetRooms(); if (state.mode === 'custom') customFromCurrent('pack'); syncInputs(); render(); });
  $('#deptName').addEventListener('input', e => { state.deptName = e.target.value.trim(); render(); });
  $('#rooms').addEventListener('change', e => {
    const i = e.target.dataset.i, s = e.target.dataset.s;
    if (i !== undefined) {
      const r = state.rooms[i]; r.on = e.target.checked;
      if (state.mode !== 'custom') autoCustom(); else { if (r.on) { r.on = false; placeRoom(r); r.on = true; } normalizePages(); }
    }
    if (s !== undefined) {
      const r = state.rooms[s];
      if (e.target.value === 'new') r.sheet = Math.max(...state.rooms.filter(x => x.on).map(x => x.sheet)) + 1;
      else r.sheet = +e.target.value;
      normalizePages();
    }
    render();
  });
  $('#allOn').addEventListener('click', () => { if (state.mode === 'custom') { state.rooms.forEach(r => { if (!r.on) placeRoom(r); r.on = true; }); normalizePages(); } else { state.rooms.forEach(r => r.on = true); autoCustom(); } render(); });
  $('#allOff').addEventListener('click', () => { state.rooms.forEach(r => r.on = false); render(); });
  let lastMode = state.mode;
  $('#mode').addEventListener('change', e => { state.mode = e.target.value; if (state.mode === 'custom' && lastMode !== 'custom') customFromCurrent(lastMode); lastMode = state.mode; render(); });
  $('#unit').addEventListener('change', e => { state.unit = e.target.value; syncInputs(); render(); });
  $('#visual').addEventListener('change', e => { state.visual = e.target.value === '1'; render(); });
  $('#year').addEventListener('change', e => { state.year = e.target.value; if (!state.year) state.month = ''; else if (!state.month) state.month = String(new Date().getMonth() + 1); syncInputs(); render(); });
  $('#month').addEventListener('change', e => { state.month = e.target.value; if (!state.month) state.year = ''; else if (!state.year) state.year = String(new Date().getFullYear()); syncInputs(); render(); });
  $('#addBtn').addEventListener('click', () => {
    if (!state.dept) { $('#dept').focus(); return; }
    const n = $('#newName').value.trim(); if (!n) { $('#newName').focus(); return; }
    const r = { name: n, type: $('#newType').value, profile: '', on: false, sheet: 1 };
    if (state.mode === 'custom') placeRoom(r); else r.sheet = state.rooms.filter(x => x.on).length + 1;
    r.on = true; state.rooms.push(r);
    $('#newName').value = ''; render();
  });
  $('#newName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#addBtn').click(); });
  $('#printBtn').addEventListener('click', () => window.print());
  $('#hwpBtn').addEventListener('click', () => {
    const blob = buildHWPX(currentSheets().blocks);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });
  $('#linkBtn').addEventListener('click', () => {
    const url = shareLink(), msg = $('#linkMsg');
    const show = () => { msg.textContent = url; msg.className = 'note'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => { msg.textContent = '복사했습니다. 이 링크를 열면 지금 설정으로 바로 열립니다.'; msg.className = 'note copied'; }, show);
    else show();
  });
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => { if (loadHash()) { lastMode = state.mode; syncInputs(); render(); } });
  window.__test = { currentSheets, buildHWPX, headerXML, sectionXML, state };
})();
</script>
</body>
</html>
